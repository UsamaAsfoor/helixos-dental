app = "adev-helixhog"
primary_region = "sjc"

[build]

[env]
  DATA_DIR = "/data"
  HELIXHOG_HOST = "0.0.0.0"
  PORT = "8080"
  META_PIXEL_ID = "920426713962047"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/e"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "helixhog_data"
  destination = "/data"
